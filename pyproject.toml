[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "usage-product-readiness"
version = "0.1.0"
description = "Readiness checker for Revenue Cloud usage products (Manage Usage Resources / STLT)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["salesforce", "revenue-cloud", "rlm", "usage", "metering", "readiness"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
]
dependencies = []  # stdlib only — the Salesforce `sf` CLI is the sole external dependency

[project.scripts]
usage-readiness = "usage_product_readiness.cli:main"

[tool.setuptools]
packages = ["usage_product_readiness"]
